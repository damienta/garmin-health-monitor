name: deploy-web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml", ".github/scripts/smoke.sh"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Same switch as the API deploy: repo variable CLOUDFLARE_DEPLOY=true.
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy

      # Smoke test: the live site answers, and still sends signed-out visitors to the
      # Cloudflare Access sign-in page (so a config slip can't leave it open).
      - name: Check the live website
        working-directory: .
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          API_URL: ${{ secrets.INGEST_URL }}
        # The URL wrangler reports, or the API's address with "-web" added as a fallback.
        run: |
          .github/scripts/smoke.sh web "${DEPLOY_URL:-$(echo "$API_URL" | sed 's#//garmin-health-monitor\.#//garmin-health-monitor-web.#')}"

      # Phone ping if the deploy or the live check failed.
      - name: Tell Discord the deploy failed
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          printf '{"content":"❌ %s deploy failed. Log: %s"}' "Website" "$RUN_URL" \
            | curl -fsS -m 10 --retry 3 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL" >/dev/null
