name: deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy.yml", ".github/scripts/smoke.sh"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Off until Cloudflare is set up: create a repo variable CLOUDFLARE_DEPLOY=true.
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      # Migrations first, so the new code never runs against an old schema.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply garmin-health-monitor --remote
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # Smoke test: the live API answers, and still refuses requests without a token.
      - name: Check the live API
        working-directory: .
        env:
          API_URL: ${{ secrets.INGEST_URL }}
        run: .github/scripts/smoke.sh api "$API_URL"

      # Phone ping if the deploy or the live check failed.
      - name: Tell Discord the deploy failed
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          printf '{"content":"❌ %s deploy failed. Log: %s"}' "API" "$RUN_URL" \
            | curl -fsS -m 10 --retry 3 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL" >/dev/null
