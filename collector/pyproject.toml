[project]
name = "sleep-collector"
version = "0.1.0"
description = "Pulls nightly sleep data from Garmin Connect"
requires-python = ">=3.11"
dependencies = [
    # Unofficial and fragile: pinned exactly so an upstream change can't break runs silently.
    "garminconnect==0.3.2",
    "pydantic>=2.7",
]

[project.scripts]
sleep-collector = "sleep_collector.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_collector"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
